name: therapy_nest
description: "Therapy Nest — Your daily practice companion for recovery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Architecture — State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.8.1

  # Backend — Supabase
  supabase_flutter: ^2.9.0

  # Network
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # Google Fonts
  google_fonts: ^6.2.1

  # Speech
  flutter_tts: ^4.2.0
  vosk_flutter: ^0.3.48
  record: ^5.2.1

  # File / Path
  path_provider: ^2.1.4
  http: ^1.2.2

  # UI Enhancements
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  animations: ^2.0.11

  # Image Picker (profile avatar)
  image_picker: ^1.1.2

  # Media
  cached_network_image: ^3.4.1

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

  # Offline Database (Drift)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

  # Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

# vosk_flutter requires permission_handler ^10.2.0 but our app uses ^11.3.1.
# This override resolves the conflict. vosk_flutter only uses permission_handler
# for runtime permission checks, which are API-compatible across v10→v11.
dependency_overrides:
  permission_handler: ^11.3.1
  http: ^1.2.2
  archive: ^4.0.0
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/AppBar.png
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/AppLogo.png"
  remove_alpha_ios: true
